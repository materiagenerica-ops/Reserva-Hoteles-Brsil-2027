<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Presupuesto Hoteles Brasil 2027</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- ================= PANTALLA DE LOGIN ================= -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
            <div class="text-center mb-6">
                <img src="reserva_hoteles.jpg" alt="Logo Hoteles Brasil" class="w-24 h-24 mx-auto rounded-full object-cover shadow-md mb-4 border-2 border-emerald-500" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
                <h1 class="text-2xl font-bold text-slate-800">Control Presupuesto</h1>
                <p class="text-sm text-slate-500">Hoteles Brasil 2027</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
                    <input type="text" id="userInput" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Usuario">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="passInput" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="••••••••">
                </div>
                <div id="loginError" class="text-red-500 text-sm text-center hidden">Usuario o contraseña incorrectos.</div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                    Ingresar
                </button>
            </form>
        </div>
    </div>

    <!-- ================= FORMULARIO PRINCIPAL (DASHBOARD) ================= -->
    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        
        <!-- BARRA SUPERIOR DE PROGRESO GLOBAL -->
        <header class="bg-white shadow-sm border-b sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <img src="reserva_hoteles.jpg" alt="Logo" class="w-14 h-14 rounded-lg object-cover border shadow-sm" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800 leading-tight">RECAUDACIÓN DE PRESUPUESTO HOTELES 2026/2027</h2>
                        <p class="text-xs text-slate-500">Torres Rio Grande do Sul - Brasil</p>
                    </div>
                </div>
                <!-- Barra de Progreso Superior -->
                <div class="w-full md:w-1/3 bg-slate-200 rounded-full h-4 overflow-hidden shadow-inner relative">
                    <div id="progressBar" class="bg-emerald-500 h-full transition-all duration-500 text-right text-[10px] text-white font-bold pr-2 flex items-center justify-end" style="width: 0%">0%</div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
            
            <!-- SECCIÓN 1: METAS DE RECAUDACIÓN (NOMBRE Y VALOR PERSONALIZABLE) -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-bullseye text-emerald-600 mr-2"></i>Metas de Recaudación (Pesos Argentinos)</h3>
                    <button onclick="guardarMetas()" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition">
                        <i class="fa-solid fa-save mr-1"></i> Actualizar Metas
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Meta 1 -->
                    <div class="p-4 border rounded-lg bg-slate-50 space-y-2">
                        <label class="block text-xs font-semibold text-slate-600">Nombre Meta 1</label>
                        <input type="text" id="nombreMeta1" class="w-full px-3 py-1.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Nombre de la meta">
                        <label class="block text-xs font-semibold text-slate-600">Valor (ARS)</label>
                        <input type="number" id="meta1" class="w-full px-3 py-1.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="0">
                    </div>
                    <!-- Meta 2 -->
                    <div class="p-4 border rounded-lg bg-slate-50 space-y-2">
                        <label class="block text-xs font-semibold text-slate-600">Nombre Meta 2</label>
                        <input type="text" id="nombreMeta2" class="w-full px-3 py-1.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Nombre de la meta">
                        <label class="block text-xs font-semibold text-slate-600">Valor (ARS)</label>
                        <input type="number" id="meta2" class="w-full px-3 py-1.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="0">
                    </div>
                    <!-- Meta 3 -->
                    <div class="p-4 border rounded-lg bg-slate-50 space-y-2">
                        <label class="block text-xs font-semibold text-slate-600">Nombre Meta 3</label>
                        <input type="text" id="nombreMeta3" class="w-full px-3 py-1.5 border rounded-lg bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Nombre de la meta">
                        <label class="block text-xs font-semibold text-slate-600">Valor (ARS)</label>
                        <input type="number" id="meta3" class="w-full px-3 py-1.5 border rounded-lg bg-white
