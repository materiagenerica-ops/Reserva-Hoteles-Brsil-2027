<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Presupuesto Hoteles Brasil 2027</title>
    <!-- Tailwind CSS Versión Compilada de Producción -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- ================= PANTALLA DE LOGIN ================= -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen px-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
            <div class="text-center mb-6">
                <img src="reserva_hoteles.jpg" alt="Logo Hoteles Brasil" class="w-24 h-24 mx-auto rounded-full object-cover shadow-md mb-4 border-2 border-green-600" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
                <h1 class="text-2xl font-bold text-gray-800">Control Presupuesto</h1>
                <p class="text-sm text-gray-500">Hoteles Brasil 2027</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                    <input type="text" id="userInput" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600" placeholder="Usuario">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="passInput" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600" placeholder="••••••••">
                </div>
                <div id="loginError" class="text-red-500 text-sm text-center hidden">Usuario o contraseña incorrectos.</div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                    Ingresar
                </button>
            </form>
        </div>
    </div>

    <!-- ================= FORMULARIO PRINCIPAL (DASHBOARD) ================= -->
    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        
        <!-- BARRA SUPERIOR DE ESTADO Y PROGRESO -->
        <header class="bg-white shadow-sm border-b sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col gap-2">
                <!-- Fila Superior: Logo y Título -->
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <img src="reserva_hoteles.jpg" alt="Logo" class="w-14 h-14 rounded-lg object-cover border shadow-sm" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
                        <div>
                            <h2 class="text-lg font-bold text-gray-800 leading-tight">RECAUDACIÓN DE PRESUPUESTO HOTELES 2026/2027</h2>
                            <p class="text-xs text-gray-500">Torres Rio Grande do Sul - Brasil</p>
                        </div>
                    </div>
                    <!-- Datos Recaudados / Meta Global -->
                    <div class="text-right flex items-center gap-4 text-sm">
                        <div>
                            <span class="text-gray-500 text-xs block">Recaudado / Metas</span>
                            <strong id="headerRecaudadoText" class="text-green-600">$0</strong> / <strong id="headerTotalMetasText" class="text-gray-800">$0</strong>
                        </div>
                    </div>
                </div>

                <!-- Barra 1: Progreso de Recaudación (Creciente) -->
                <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden shadow-inner relative">
                    <div id="progressBar" class="bg-green-600 h-full transition-all duration-500 text-right text-xs text-white font-bold pr-2 flex items-center justify-end" style="width: 0%">0%</div>
                </div>

                <!-- Barra 2: Saldo Pendiente de Metas (Decreciente con Desglose) -->
                <div class="pt-2 border-t border-gray-100 flex flex-col gap-1">
                    <div class="flex justify-between items-center text-xs font-semibold text-gray-700">
                        <span><i class="fa-solid fa-chart-pie text-orange-500 mr-1"></i> Saldo Pendiente de las Metas: <span id="nombresMetasResumen" class="text-gray-500 font-normal"></span></span>
                        <span id="saldoRestanteText" class="text-orange-600 font-bold">$0 ARS</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden shadow-inner relative">
                        <div id="progressRestanteBar" class="bg-orange-500 h-full transition-all duration-500" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
            
            <!-- SECCIÓN 1: METAS DE RECAUDACIÓN (NOMBRE Y VALOR PERSONALIZABLE) -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-bullseye text-green-600 mr-2"></i>Metas de Recaudación (Pesos Argentinos)</h3>
                    <button onclick="guardarMetas()" class="bg-gray-800 hover:bg-gray-900 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition">
                        <i class="fa-solid fa-save mr-1"></i> Actualizar Metas
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Meta 1 -->
                    <div class="p-4 border rounded-lg bg-gray-50 space-y-2">
                        <label class="block text-xs font-semibold text-gray-600">Nombre Meta 1</label>
                        <input type="text" id="nombreMeta1" class="w-full px-3 py-1.5 border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-600" placeholder="Ej: Hotel Principal">
                        <label class="block text-xs font-semibold text-gray-600">Valor (ARS)</label>
                        <input type="number" id="meta1" class="w-full px-3 py-1.5 border rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-600" placeholder="0">
                    </div>
                    <!-- Meta 2 -->
                    <div class="p-4 border rounded-lg bg-gray-50 space-y-2">
                        <label class="block text-xs font-semibold text-gray-600">Nombre Meta 2</label>
                        <input type="text" id="nombreMeta2"
